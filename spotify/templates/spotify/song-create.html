{% extends 'spotify/base.html'%}
{% block content %}
    <div>
        <h5 style="color: #D2B48C; font-weight: bold;">Upload Songs to Dopify Database</h5>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Upload Your Song</button>
        </form>
    </div>
{% endblock content %}
