{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Spotify</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        * {box-sizing: border-box;}
        body {
            background-repeat: no-repeat;
            background-size: cover;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .header {
            overflow: hidden;
            background-image: url("../static/images/Background4s.png");
            background-size: cover;
            padding: 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header a {
            color: black;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            font-size: 18px;
            border-radius: 4px;
            border: 2px solid transparent;
            margin: 0 10px;
        }
        .header a.logo {
            float: left;
            display: block;
            width: 250px;
            height: auto;
            margin-right: auto;
        }
        .header a.active:hover {
            background-color: #ddd;
            color:black;
        }
        .header a.active {
            background-color: dodgerblue;
            color: white;
        }
        .header-right {
            float: right;
        }
        .header a:not(.logo):hover {
            border-color: #ddd;
        }
        @media screen and (max-width: 500px) {
            .header a {
                float: none;
                display: block;
                text-align: left;
            }
            .header-right {
                float: none;
            }
        }
        @media screen and (max-width: 1240px) {
            /* Adjust styles for screens with a maximum width of 1240px */
            .header {
                padding: 10px;
            }
            .header a.logo {
                width: 150px; /* Adjust logo width */
            }
            /* Add more styles as needed for smaller screens */
        }
        .container {
            text-align: center;
            padding: 100px;
        }
        .login-form {
            padding: 20px;
            border-radius: 5px;
            max-width: 400px;
            margin: 0 auto;
            margin-top: 100px;
        }
        .login-form h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        .login-form button {
            background-color: dodgerblue;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="{% url 'home' %}" class="logo"><img src="../static/images/Untitled.png" alt="Dopify" height="55px" width="175px"></a>
        <div class="header-right">
            <a class="active" href="{% url 'create' %}">Upload Songs on Dopify!</a>
            {% if user.is_authenticated %}
            <a class="active" href="{% url 'logout' %}">Logout</a>
            {% endif %}
        </div>
    </div>
    <div class="container" id="app">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
